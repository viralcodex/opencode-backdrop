name: Enforce owner approval

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_run:
    workflows: [PR review event]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
  # Reconcile reviews even if a fork's review-event workflow cannot run.
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pull-requests: read
  statuses: write

# Every run reconciles all open PRs, so replacing a pending run loses no events.
concurrency:
  group: owner-approval
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always use trusted main, never a PR's code or merge commit.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { reconcile } = require('./.github/scripts/owner-approval.cjs')
            await reconcile({ github, context, core })
